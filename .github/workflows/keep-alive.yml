# Pings the deployed app every ~10 minutes so Render's free instance does not
# spin down from inactivity (a cold start otherwise costs the first visitor
# ~30-50s). Set the repo variable APP_URL (Settings -> Secrets and variables ->
# Actions -> Variables) to the deployed origin, e.g.
#   https://gym-tracker.onrender.com
#
# GitHub's scheduler can run late under load; if cold starts still bite, use a
# dedicated pinger such as cron-job.org instead (see DEPLOYMENT-CLOUD.md).
# Scheduled workflows are auto-disabled after 60 days with no repo activity.

name: keep-alive

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: GET /healthz
        run: |
          if [ -z "${{ vars.APP_URL }}" ]; then
            echo "APP_URL variable is not set — skipping."
            exit 0
          fi
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 90 "${{ vars.APP_URL }}/healthz")
          echo "GET ${{ vars.APP_URL }}/healthz -> $code"
          test "$code" = "200"
