<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- width=device-width so the phone uses its real pixel width, not a
         zoomed-out 980px desktop viewport. maximum-scale is left alone so
         users can still pinch-zoom (an accessibility requirement). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <title>Gym Tracker</title>
  </head>
  <body>
    <!-- React mounts the whole app into this one element. Everything you see is
         built by JavaScript at runtime — the server sends an almost-empty page. -->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
