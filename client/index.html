<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- width=device-width so the phone uses its real pixel width, not a
         zoomed-out 980px desktop viewport. maximum-scale is left alone so
         users can still pinch-zoom (an accessibility requirement). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <title>Gym Tracker</title>
    <style>
      /* Shown until the JS bundle parses and React replaces #root's contents.
         On the free host's first hit after it sleeps this also covers the
         brief gap while the app boots. */
      #boot {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font: 15px/1.4 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        color: #64748b;
      }
      #boot .spin {
        width: 22px;
        height: 22px;
        margin-right: 10px;
        border: 2.5px solid #cbd5e1;
        border-top-color: #0f172a;
        border-radius: 50%;
        animation: boot-spin 0.7s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <!-- React mounts the whole app into this one element. Everything you see is
         built by JavaScript at runtime — the server sends an almost-empty page. -->
    <div id="root"><div id="boot"><span class="spin"></span>Loading Gym Tracker…</div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
