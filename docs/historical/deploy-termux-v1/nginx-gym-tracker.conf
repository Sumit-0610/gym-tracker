# Gym Tracker — nginx server block for Termux (no root, port 8080).
#
# Placement (pick one):
#   A) Replace the `server { ... }` block in
#      $PREFIX/etc/nginx/nginx.conf   ($PREFIX = /data/data/com.termux/files/usr)
#   B) Keep nginx.conf's http{} wrapper and add, inside http{}:
#         include /data/data/com.termux/files/home/gym-tracker/deploy/nginx-gym-tracker.conf;
#
# After any change:  nginx -t   &&   nginx -s reload
#
# EDIT THIS if you cloned the repo somewhere other than ~/gym-tracker:
#   the `root` line below must point at <repo>/client/dist

server {
    listen       8080;
    # (IPv4 only — add `listen [::]:8080;` if you actually need IPv6 on the LAN)
    server_name  _;

    # Built React app (produced by `npm run build` in client/).
    root   /data/data/com.termux/files/home/gym-tracker/client/dist;
    index  index.html;

    # Don't leak the nginx version on error pages.
    server_tokens off;

    # ---- API -> Express -------------------------------------------------
    # This block is matched BEFORE the SPA fallback below, so /api/* is always
    # proxied and never served index.html.
    location /api/ {
        proxy_pass http://127.0.0.1:3000;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # express-session's Set-Cookie / the browser's Cookie header pass
        # through unmodified — same host, so no cookie domain rewriting needed.

        # ---- OPTIONAL login rate limiting --------------------------------
        # Needs this line in the http{} block (nginx.conf), ONCE:
        #   limit_req_zone $binary_remote_addr zone=gymauth:1m rate=10r/m;
        # then uncomment:
        # limit_req zone=gymauth burst=5 nodelay;
        # (10 login/signup attempts per minute per IP, small bursts allowed.)
    }

    # ---- hashed build assets: safe to cache hard ----------------------
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ---- SPA fallback -------------------------------------------------
    # Any other path that isn't a real file -> index.html, so client-side
    # routes like /history/5 load the app instead of 404ing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html itself must never be cached, or users get a stale app after
    # an update.
    location = /index.html {
        add_header Cache-Control "no-store";
    }
}
