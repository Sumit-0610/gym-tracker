# Render Blueprint — declares the web service so it can be recreated without
# clicking through the dashboard. In Render: New + -> Blueprint -> pick this repo.
#
# The three `sync: false` / `generateValue` vars are set in Render's dashboard,
# never committed:
#   TURSO_DATABASE_URL  libsql://gym-tracker-<org>.turso.io   (from Turso)
#   TURSO_AUTH_TOKEN    <secret>                              (from Turso)
#   SESSION_SECRET      generated by Render on first deploy

services:
  - type: web
    name: gym-tracker
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon            # same region as the Turso database
    branch: main
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: SESSION_SECRET
        generateValue: true
